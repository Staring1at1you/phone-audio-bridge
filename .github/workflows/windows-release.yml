name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android SDK packages
        shell: pwsh
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0" "platform-tools"
      - name: Build Android APK
        shell: pwsh
        run: .\build-android.ps1 -Sdk $env:ANDROID_HOME -Gradle (Get-Command gradle).Source
      - name: Build Windows ZIP
        shell: pwsh
        run: |
          $taskVersion = if ($env:GITHUB_REF_NAME -like 'v*') { $env:GITHUB_REF_NAME.Substring(1) } else { 'dev' }
          .\build-release.ps1 -Version $taskVersion -AdbSource "$env:ANDROID_HOME\platform-tools" -SkipAndroidBuild
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneAudioBridge-Windows
          path: artifacts/*.zip
      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
